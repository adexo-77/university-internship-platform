name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.12, Ruff, Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: university_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Check code formatting (ruff format)
        run: ruff format --check .
        working-directory: backend

      - name: Lint codebase (ruff check)
        run: ruff check .
        working-directory: backend

      - name: Prepare test database
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -c "CREATE DATABASE university_platform_test;"

      - name: Run backend test suite (pytest)
        run: pytest -v
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/university_platform
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/university_platform_test
          ENVIRONMENT: test

  frontend:
    name: Frontend (Node LTS, Lint, Format, Vitest, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Check code formatting (prettier)
        run: npm run format:check
        working-directory: frontend

      - name: Lint codebase (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Run test suite (vitest)
        run: npm test
        working-directory: frontend

      - name: Build production bundle (vite)
        run: npm run build
        working-directory: frontend

  migrations:
    name: Migrations Drift & Single-Head Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: university_platform_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run migrations on fresh database
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/university_platform_fresh

      - name: Assert single Alembic migration head
        run: |
          heads_count=$(alembic heads | wc -l)
          if [ "$heads_count" -ne 1 ]; then
            echo "Error: Expected exactly 1 Alembic head, found $heads_count"
            alembic heads
            exit 1
          fi
          echo "Verified single Alembic migration head:"
          alembic heads
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/university_platform_fresh

      - name: Check for model drift (alembic check)
        run: alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/university_platform_fresh

  docker-smoke:
    name: Docker Build & Compose Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create docker environment file from template
        run: cp .env.docker.example .env.docker

      - name: Start Docker Compose stack with health wait
        run: docker compose up --build -d --wait

      - name: Smoke test API health endpoint through Nginx proxy
        run: |
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/api/health
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080/api/health/db

      - name: Seed demo dataset in container
        run: docker compose run --rm backend python scripts/seed_demo.py

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v

