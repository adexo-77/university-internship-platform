services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-university_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d university_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-university_platform}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-university_platform}}
      TEST_DATABASE_URL: ${DOCKER_TEST_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-university_platform}_test}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: ${DOCKER_PORT:-8000}
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PUBLIC_MODE: ${DEMO_PUBLIC_MODE:-false}
      RATE_LIMIT_LOGIN_IP_LIMIT: ${RATE_LIMIT_LOGIN_IP_LIMIT:-100}
      RATE_LIMIT_CHANGE_PASSWORD_LIMIT: ${RATE_LIMIT_CHANGE_PASSWORD_LIMIT:-50}
    command: sh -c "alembic upgrade head && (if [ \"$$SEED_DEMO\" = \"true\" ]; then python scripts/seed_demo.py; fi) && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
